#-------------------------------------------------------------------------------

#-------------------------------------------------------------------------------
# 1.0 Global options
#-------------------------------------------------------------------------------

# Bash as default-shell
set -g default-shell "/bin/bash"

# Mouse
set -g mouse on

# Colors
set-option -g default-terminal "xterm-256color" #"xterm-256color" # "screen-256color"
set-option -sa terminal-overrides ",xterm*:Tc"
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# Large history
set-option -g history-limit 10000

# Basic settings
setw -g xterm-keys on # for vim
setw -g mode-keys vi # vi keys
setw -g monitor-activity on

# prefix : - to enter command mode
#
#-------------------------------------------------------------------------------
# 2.0 Status bar
#-------------------------------------------------------------------------------

# Titles (window number, program name, active (or not)
set-option -g set-titles on

# Increase space onr right status bar
set -g status-position top       # macOS / darwin style split


#-------------------------------------------------------------------------------
# 3.0 Unbindings
#-------------------------------------------------------------------------------

# Unbind [ # copy mode bound to escape key
unbind j
unbind '"' # unbind horizontal split
unbind %   # unbind vertical split
unbind p   # unbind previous window
unbind n   # unbind next window

unbind C-b
set -g prefix C-Space

#-------------------------------------------------------------------------------
# 4.0 Bindings
#-------------------------------------------------------------------------------

# Reload tmux conf
bind r source-file ~/.config/tmux/tmux.conf
bind c new-window -n 'tmux'

#-------------------------------------------------------------------------------
# 5.0 Windows
#-------------------------------------------------------------------------------

setw -g aggressive-resize on

# Windows navigation
#--------------------------------------

# prefix c - create window
# prefix n - next window
# prefix p - previous window
# prefix # - open # window
# prefix , - rename window

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Split
#--------------------------------------
bind v split-window -v -c '#{pane_current_path}'
bind b split-window -h -c '#{pane_current_path}'

#-------------------------------------------------------------------------------
# 6.0 Panes
#-------------------------------------------------------------------------------

# Navigation: use the vim motion keys to move between panes
#--------------------------------------

# Requires the alexghergh/nvim-tmux-navigator plug in in LazyVim
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \

    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='#{s/v//:version}'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\"' 'select-pane -l'"

# Set vim-mode
set-window-option -g mode-keys vi

# Vim kebindings
bind-key -T copy-mode-vi 'v' send-keys -X begin-selections
bind-key -T copy-mode-vi 'C-v' send-keys -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Resizing
#--------------------------------------

bind C-h resize-pane -L 16
bind C-j resize-pane -D 16
bind C-k resize-pane -U 16
bind C-l resize-pane -R 16

# Break-pane
#--------------------------------------

bind Enter break-pane

#-------------------------------------------------------------------------------
# 7.0 Layouts
#-------------------------------------------------------------------------------

bind o select-layout "tiled"
bind M-b select-layout "even-vertical"
bind M-v select-layout "even-horizontal"
bind M-r rotate-window

#-------------------------------------------------------------------------------
# 8.0 Plugins TPM
#-------------------------------------------------------------------------------
#

# Plugin Manager - https://github.com/tmux-plugins/tpm

# 1. $ git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# 2. Reload tmux if it is already started with `r
# 3. Launch tmux and hit `I` (capital i) to fetch any plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'dracula/tmux'

# dracula-config
#--------------------------------------

set -g @dracula-plugins "cpu-usage gpu-usage ram-usage"
set -g @dracula-show-location false
set -g @dracula-military-time true
set -g @dracula-border-contrast true
set -g @dracula-show-powerline true
set -g @dracula-show-edge-icons false
set -g @dracula-left-pad ""
set -g @dracula-right-pad ""
set -g @dracula-day-month true
set -g @dracula-military-time true


# tmux-resurrect
#--------------------------------------

# prefix + Ctrl-s - save all the sessions
# prefix + Ctrl-r - restore all the sessions

set -g @resurrect-strategy-vim 'session'
set -g @continuum-restore 'on'

# Initializes TMUX plugin manager.
# Keep this line at the very bottom of tmux.conf.
run -b '~/.tmux/plugins/tpm/tpm
